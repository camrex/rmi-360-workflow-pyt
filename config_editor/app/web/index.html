<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RMI 360 Config Editor</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="toolbar">
    <div class="brand">RMI&nbsp;360 <span>Config Editor</span></div>
    <div class="actions">
      <label class="profile">
        New from
        <select id="profile-select"><option value="">sample defaults</option></select>
        <button id="btn-new">New</button>
      </label>
      <span class="sep"></span>
      <button id="btn-open">Open…</button>
      <button id="btn-upgrade" class="hidden" title="Migrate to the current schema version">Upgrade…</button>
      <button id="btn-validate">Validate</button>
      <button id="btn-preview" class="ghost">Preview</button>
      <button id="btn-save" class="primary">Save…</button>
    </div>
  </header>

  <main class="layout">
    <nav id="sidebar" class="sidebar" aria-label="Sections"></nav>

    <section class="content">
      <div class="form-pane">
        <div id="section-header" class="section-header"></div>
        <form id="form" class="form" autocomplete="off"></form>
      </div>
      <aside id="section-guide" class="guide-pane"></aside>
    </section>

    <aside id="preview" class="preview hidden">
      <div class="preview-head">
        <strong>config.yaml preview</strong>
        <button id="btn-preview-close" class="ghost small">Close</button>
      </div>
      <pre id="preview-body" class="preview-body"></pre>
    </aside>
  </main>

  <footer class="statusbar">
    <span id="status" class="status">Ready.</span>
    <span id="meta" class="meta"></span>
  </footer>

  <!-- Validation panel -->
  <div id="issues" class="issues hidden">
    <div class="issues-head">
      <strong>Validation</strong>
      <button id="btn-issues-close" class="ghost small">Close</button>
    </div>
    <ul id="issues-list" class="issues-list"></ul>
  </div>

  <!-- Upgrade report modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <h2 id="modal-title">Upgrade</h2>
      <div id="modal-body" class="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="ghost">Cancel</button>
        <button id="modal-confirm" class="primary">Apply upgrade</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

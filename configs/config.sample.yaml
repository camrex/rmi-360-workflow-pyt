
# 📎 NOTE: All placeholder values in this file are wrapped in angle brackets, e.g.:
#   "<YOUR_AWS_S3_REGION>", "<PROJECT_SLUG>", "<CLIENT_NAME>"
# Replace each one with the actual value for your project.
#
# schema_version (str): Defines which config format version this file conforms to.
# Used for future validation and compatibility checks.
schema_version: 1.3.3
debug_messages: false

# NEW RUNTIME CONFIG
#
# local_root defines the base directory for project data on the EC2 instance.
# All project files are stored in: {local_root}/projects/{project_key}/
#
# Expected structure on EC2:
#   D:/Process360_Data/projects/{project_key}/
#     ├── reels/          # Raw 360 video reels
#     ├── config/         # Project-specific config files
#     ├── gis_data/       # GIS reference data
#     ├── backups/        # OID backup snapshots
#     ├── logs/           # Processing logs
#     ├── panos/          # Extracted panoramic images
#     └── report/         # HTML reports and metrics
#
# Corresponding S3 structure in rmi-360-raw:
#   s3://rmi-360-raw/{project_key}/
#     ├── reels/          # Raw video uploads
#     ├── config/         # Configuration files
#     └── gis_data/       # GIS reference data
#
runtime:
  local_root: "D:/Process360_Data"   # Base path on EC2 (ignored on desktop)

# ------------------------------------------------------------------------------
# 🪵 LOGGING & FILE PATHS
# ------------------------------------------------------------------------------
# This section defines where log and debug files are written, and what filenames
# are used across the various steps in the Mosaic 360 workflow.
#
# Used by:
#   - All tools that write progress, debug, or argument files
#   - process_report_template.html (for referencing logs in reports)
#
# ─── Global Settings ──────────────────────────────────────────────────────────
#
# path              (str)   - Relative folder path where general log files are written
# report_path       (str)   - Folder where report_data.json and report.html are stored
# prefix            (expr)  - Expression used to prefix filenames (e.g., project slug)
#
# ─── Step-Specific Logs ───────────────────────────────────────────────────────
#
# mosaic_processor_log (str) - Output capture file for Mosaic Processor CLI
# exiftool_logs        (str) - Text output from ExifTool
# exiftool_args        (str) - .args batch file passed to ExifTool
#
# geocode_logs         (str) - ExifTool log for geocoding pass
# geocode_args         (str) - .args batch file for geocoding
#
# gps_smooth_debug     (str) - CSV debug output for GPS smoothing outliers
#
# aws_upload_log       (str) - Main CSV log for copy_to_aws uploads
# rename_log           (str) - File rename summary log
# process_log          (str) - Master runtime log (used by orchestrator, messages, etc.)
# ------------------------------------------------------------------------------
logs:
  path: "logs"
  report_path: "report"
  logo_filename: "rmi_logo.png"  # Logo should be located in templates/assets
  prefix: "config.project.slug"
  mosaic_processor_log: "mosaic_processor_output.log"
  exiftool_logs: "exiftool_log.txt"
  exiftool_args: "exiftool_batch.args"
  geocode_logs: "exiftool_geocode_log.txt"
  geocode_args: "exiftool_geocode.args"
  gps_smooth_debug: "debuglog_outliers.csv"
  distance_spacing_debug: "debuglog_distance_spacing.csv"
  aws_upload_log: "aws_upload_log.csv"
  aws_upload_summary: "aws_upload_summary.csv"
  rename_log: "rename_log.csv"
  process_log: "process_log.txt"

# --------------------------------------------------------------------
# 📁 PROJECT-LEVEL METADATA
# --------------------------------------------------------------------
#
# This section defines metadata unique to the current imagery capture project.
# These values are referenced throughout the workflow in:
#   - Output filenames (`filename_settings`)
#   - EXIF/XMP metadata tags (`metadata_tags`)
#   - AWS export paths
#   - Portal item summaries and tags
#   - Custom OID fields (e.g., RR, Client)
#
# 📌 Fields:
#   - company: Organization responsible for imagery (used in Author/Artist tags)
#   - number: Human-readable project number (e.g., "25-100")
#   - slug: Machine-safe project ID used in filenames or S3 folder paths (e.g., "RMI25100")
#   - client: Client organization(s) or stakeholders
#   - description: Short textual description of the project
#   - rr_name: Full name of the railroad (used in portal metadata or XPKeywords)
#   - rr_mark: Railroad reporting mark (used in filename and OID fields)
#   - local_proj_wkid: EPSG WKID of local projected CRS used in `build_oid_footprints`
#
# 📚 Tip:
# These values are referenced using `config.project.KEY` in expressions.
#
project:
  company: "<YOUR COMPANY NAME>"           # Author of the imagery / data
  number: "<PROJECT_NUMBER>"               # Project ID (YY-###)
  slug: "<PROJECT_SLUG>"                   # Suffix-safe identifier for filenames or folders (ABCYY###)
  client: "<CLIENT_NAME>"                  # Client Name
  description: "<PROJECT_DESCRIPTION>"     # Project Description
  rr_name: "<RAILROAD_NAME>"               # Full railroad name (This can be replaced, BUT CHECK image_output)
  rr_mark: "<RAILROAD_MARK>"               # Railroad reporting mark (This can be replaced, BUT CHECK image_output)
# ⚠️ VERY IMPORTANT:
# local_proj_wkid must be updated to match the local projected coordinate system used for this project.
# Used for OID footprint.
# Common examples:
#   - NAD 1983 StatePlane Massachusetts Mainland (US Feet) → 6492
#   - NAD 1983 StatePlane California Zone 5 (US Feet) → 2229
#   - NAD 1983 UTM Zone 14N → 26914
# Failing to update this may cause incorrect OID footprint geometry or empty layers.
  local_proj_wkid: <YOUR_PROJECT_WKID>

# --------------------------------------------------------------------
# 📷 CAMERA & HARDWARE CONFIGURATION
# --------------------------------------------------------------------
#
# This section stores camera hardware metadata used for:
#   - Embedding EXIF/XMP metadata during image tagging (e.g., Make, Model, Firmware)
#   - Populating expressions in metadata_tags or XPKeywords
#   - Optional display in reports, metadata exports, or OID fields
#
# Fields here should reflect the physical camera system used during the imagery collection.
# These values are referenced using `config.camera.KEY`.
#
# 📎 Used In:
#   - metadata_tags (e.g., Model, Make, Software, FirmwareVersion)
#   - XPKeywords (for filtering or search)
#
camera:
  make: "Mosaic"                                      # Camera manufacturer
  model: "Mosaic 51"                                  # Model name (used in EXIF) - (adjust as needed)
  sn: "<SERIAL_NUMBER>"                               # Serial number
  firmware: "2.2.0"                                   # Installed firmware version (adjust as needed)
  software: "Mosaic Processor 1.0.1/MistikaVR 10.14"  # Processing software version string (adjust as needed)
  stitching_software: "MistikaVR"
  image_width: 12288
  image_height: 6144
  source_photos: 6

# --------------------------------------------------------------------
# 📏 CAMERA OFFSET: GNSS to Camera Lens Center
# --------------------------------------------------------------------
# This section defines the physical offsets used to calculate:
#   - Camera Z offset: vertical shift from the GPS antenna to the camera center
#   - Camera height: total height from ground to lens center (used in OID metadata)
#   - Optional future X/Y lever arm adjustment (not applied today)
#
# 🧭 Coordinate Frame:
#   - X: positive is to the right
#   - Y: positive is forward
#   - Z: positive is upward
#
# 🛠 Units:
#   - All values are in centimeters
#   - Values will be converted to meters automatically in scripts
#
# 🧪 Integration:
#   - Z components are summed to produce z_offset (for vertical GPS correction)
#   - Camera height is summed from the ground to the lens center
#   - X/Y components are defined here for possible use in spatial or EXIF correction
#
# 🔮 Future Support:
#   Mosaic has indicated possible CLI support for `GPS_LEVER_ARM` using:
#     mosaic_processor --gps-lever-arm 1.0,2.0,3.0
#   This config is structured to support that format seamlessly.
#
# 📚 Reference:
#   From Mosaic documentation (README_mosaic_processor.md, 2024-12-16):
#   > "The X/Y/Z coordinate values are used to shift the position measured by the GNSS.
#   > The lever arm defines the displacement between the camera center and the GNSS antenna."
#
camera_offset:
  # X/Y/Z lever arm between GNSS antenna and camera center (right, forward, up)
  x:
    adj: 0.0  # in cm — not currently used
  y:
    adj: 0.0  # in cm — not currently used
  z:
    gps_base_height: -7.5   # Height of GPS antenna above vehicle roof (negative if GPS is above)
    mount_height: 51.0      # Height from roof to base of camera mount
    lens_height: 16.5       # Height from mount base to center of camera lens

  # Total height from ground to camera lens center (used for OID field 'CameraHeight')
  camera_height:
    rail_height: 16.8       # Ground to top of rail
    vehicle_height: 208.3   # Rail to vehicle roof
    mount_height: 51.0      # Roof to mount base
    lens_height: 16.5       # Mount base to lens center

# --------------------------------------------------------------------
# 📐 SPATIAL REFERENCE SYSTEMS
# --------------------------------------------------------------------
#
# These WKIDs define the coordinate systems used throughout the 360 imagery workflow.
#
# Used in:
#   - OID metadata (X/Y/Z, SRS, CameraOrientation)
#   - Projected analysis (e.g., OID footprints, spatial joins)
#
# Coordinate System Roles:
#   - gcs_horizontal_wkid: Geographic CRS (e.g., WGS 1984)
#   - vcs_vertical_wkid: Vertical CRS (e.g., Ellipsoidal height)
#   - pcs_horizontal_wkid: Projected CRS (used only in build_oid_footprints)
#
# NOTE:
#   The pcs_horizontal_wkid is resolved from `project.local_proj_wkid`
#   to ensure it remains project-specific, but is referenced here for convenience
#   so that all SRS definitions can be accessed from config.spatial_ref.
#
# Reference:
#   - WKID 4326 = WGS 1984 (horizontal)
#   - WKID 5703 = WGS 1984 Ellipsoidal Height (vertical)
#
spatial_ref:
  gcs_horizontal_wkid: 4326                         # Geographic — used in OID SRS
  vcs_vertical_wkid: 5703                           # Vertical — Ellipsoidal (GPS)
  pcs_horizontal_wkid: "config.project.local_proj_wkid"  # Projected — for footprint projection
  transformation: null                              # Manually set geographic transformation, if desired, otherwise ArcGIS Pro will pick

# --------------------------------------------------------------------
# ⚙️ EXECUTABLE PATHS
# --------------------------------------------------------------------
#
# Paths to system-level tools used during the processing pipeline.
# These tools are called via subprocess or CLI, and must be accessible
# from the environment where scripts are executed (typically ArcGIS Pro's Python).
#
# ✅ Windows-compatible paths should use forward slashes `/` or double backslashes `\\`.
# ✅ Paths can be relative or absolute. Relative paths are resolved from the project root.
#
# Tools included:
#   • ExifTool — for writing EXIF/XMP metadata to image files
#   • Mosaic Processor — for stitching and rendering panoramic imagery
#   • GRP file — camera-specific calibration data (provided by Mosaic), required for rendering
#
# 🧪 Notes:
# - If `exiftool` is already in your system PATH, the default 'exiftool' string will work.
# - If Mosaic Processor adds support for CLI-configurable `config.ini`, support for
#   advanced options (e.g., GPS lever arm) can be added here in the future.
# - If you maintain multiple GRP files for different cameras or projects, this value
#   can be overridden per-project in future config profiles.
#
executables:
  exiftool:
    exe_path: "exiftool"  # Command-line call or full path to ExifTool binary
  mosaic_processor:
    exe_path: "<YOUR_ABSOLUTE_PATH_TO_MOSAIC_PROCESSOR_EXECUTABLE>"               # Full path to Mosaic Processor GUI/CLI
    grp_path: "<YOUR_ABSOLUTE_PATH_TO_MOSAIC_GRP_FILE>"                           # Default GRP file for Mosaic 51 camera
    cfg_path: "DISABLED"                                                          # RESERVED FOR FUTURE FUNCTIONALITY

# --------------------------------------------------------------------
# 🧱 ORIENTED IMAGERY DATASET (OID) SCHEMA TEMPLATE MANAGEMENT
# --------------------------------------------------------------------
#
# This section defines the structure of the OID schema template used to
# generate Oriented Imagery Datasets. It combines:
#   - ESRI-standard OID fields (driven from a centralized registry)
#   - Mosaic-specific fields (e.g., Reel, Frame)
#   - Group Index field (e.g., GroupIndex)
#   - Linear referencing fields (e.g., MP_Pre, MP_Num)
#   - Project-specific custom fields (e.g., Railroad ID)
#
# The template is built using `build_oid_schema.py` and consumed by
# `create_oid_feature_class.py`. It outputs a schema table or GDB template
# that can be reused when creating new feature classes.
#
# 🗃️ FIELD SOURCES
# --------------------------------------------------------------------
# ➤ esri_default: Pulls all ESRI-supported OID fields from a YAML registry.
#                 This registry defines required, optional, and derived fields.
#
# ➤ mosaic_fields: Additional fields used in Mosaic 360 workflows, such as
#                  Reel and Frame numbers (parsed from filename or EXIF).
#
# ➤ grp_idx_fields: Fields related to repeating group indices for display control.
#                   These are used by `assign_group_index.py` to enable filtered
#                   viewing intervals in ArcGIS Pro without duplicating geometry.
#
#                   🧠 GroupIndex filtering usage in ArcGIS Pro:
#                     - 5m display: Show all images (no filter needed)
#                     - 10m display: Filter for GroupIndex IN (1, 3) or (2, 4)
#                     - 20m display: Filter for GroupIndex = 1 (or 2, 3, or 4)
#
# ➤ linear_ref_fields: Fields populated by `locate_images_along_route.py`
#                      using M-enabled centerline geometry. Typically includes:
#                      - Route identifier (e.g., MP_Pre)
#                      - Route measure (e.g., MP_Num)
#
# ➤ custom_fields: Fields computed using expressions referencing config or
#                  project-specific attributes. Populated using:
#                    `update_linear_and_custom.py`
#
# 🧪 FIELD DEFINITION FORMAT
# --------------------------------------------------------------------
# Each field must follow this structure:
#   name:        Field name (string)
#   type:        ESRI field type (TEXT, DOUBLE, LONG, DATE, etc.)
#   length:      Required for TEXT fields (null for other types)
#   alias:       Friendly display name (used in ArcGIS)
#   expression:  (Optional) Expression for computing values dynamically
#
# ➤ Expressions are only supported in `custom_fields`
#   - They may reference:
#       - config values (e.g., config.project.rr_mark)
#       - resolved milepost values (e.g., mp_value, route_id)
#
# 🛑 STRUCTURE RULES
# --------------------------------------------------------------------
# Do not remove or rename the top-level keys:
#   - esri_default
#   - mosaic_fields
#   - linear_ref_fields
#   - custom_fields
#
# These keys must remain for template generation and validation logic.
# If unused, leave their content commented out or empty (e.g., {}).
#
# ESRI Oriented Imagery documentation:
# - https://pro.arcgis.com/en/pro-app/latest/help/data/imagery/oriented-imagery-table.htm
oid_schema_template:
  template:
    auto_create_oid_template: true
    templates_dir: "templates"
    gdb_path: "templates.gdb"  # located in "templates_dir"
    template_name: "oid_schema_template"
  esri_default:
    field_registry: "configs/esri_oid_fields_registry.yaml"
    standard: true
    not_applicable: false
  mosaic_fields:  # Extra fields used only in Mosaic workflows
    mosaic_reel:
      name: "Reel"
      type: "TEXT"
      length: 4
      alias: "Reel ID"
    mosaic_frame:
      name: "Frame"
      type: "TEXT"
      length: 6
      alias: "Frame"
  grp_idx_fields:
    group_index:
      name: "GroupIndex"
      type: "SHORT"
      length: null
      alias: "Display Interval Group"
  linear_ref_fields:  # Fields populated by locate_images_along_route
    route_identifier:
      name: "MP_Pre"
      type: "TEXT"
      length: 6
      alias: "Prefix"
    route_measure:
      name: "MP_Num"
      type: "DOUBLE"
      length: null
      alias: "Milepost"
  custom_fields:  # Project-specific fields populated using expressions
    custom1:
      name: "RR"
      type: "TEXT"
      length: 6
      alias: "Railroad Code"
      expression: "config.project.rr_mark"
#    You can define additional custom fields as needed:
#    custom2:
#      name: "FieldName"
#      type: "TEXT"
#      length: 12
#      alias: "Field Alias"
#      expression: ""

# ------------------------------------------------------------------------------
# 🔢 SEQUENCE ORDER (Optional OID Navigation Ordering)
# ------------------------------------------------------------------------------
# Controls optional population of the SequenceOrder field used by OID sequential
# navigation.
#
# Behavior:
#   - enabled: false -> field remains null
#   - enabled: true  -> values are assigned deterministically across the full OID
#
# Ordering mode:
#   - If Linear Referencing is enabled in the workflow and MP fields are present,
#     ordering uses grouped MP_Pre + MP_Num.
#   - Otherwise ordering falls back to AcquisitionDate.
#
# Decision controls:
#   - prefix_order: explicit group order for MP_Pre values. Any prefixes not listed
#     are ordered alphabetically after listed prefixes.
#   - descending_prefixes: prefixes where MP_Num should run high to low.
#   - null_milepost_position: where null MP_Num rows are placed inside each prefix group.
# ------------------------------------------------------------------------------
sequence_order:
  enabled: false
  field_name: "SequenceOrder"
  acquisition_datetime_field: "AcquisitionDate"
  lr_prefix_field: "MP_Pre"
  lr_mile_field: "MP_Num"
  prefix_order: []              # Example: ["G", "H", "K", "MH"]
  descending_prefixes: []       # Example: ["MH"]
  null_milepost_position: "end"  # Options: "start", "end"

# ------------------------------------------------------------------------------
# 🛰️ GPS CORRECTION / SMOOTHING – Outlier Detection Configuration
# ------------------------------------------------------------------------------
# Controls the detection and flagging of GPS noise using deviation,
# heading angle, proximity spacing, and (optionally) distance from route.
#
# Key Concepts:
#   - Points are compared against their neighbors (with a smoothing window)
#   - Multiple criteria must fail to be flagged as outliers
#   - Optionally logs a debug CSV for visualization/troubleshooting
#
# Parameters:
#   deviation_threshold_m: Max lateral distance (in meters) from midpoint line
#   angle_bounds_deg: Acceptable angle between forward and backward bearings
#   proximity_check_range_m: Allowed step spacing variance
#   max_route_dist_deviation_m: Allowed distance drift from centerline (if provided)
#   smoothing_window: Number of neighbors before/after to evaluate
#   outlier_reason_threshold: Minimum failed criteria to flag outlier
#   segment_break_distance_m: Distance jump that starts a new capture segment within a reel
#   segment_break_time_seconds: Time gap that starts a new capture segment within a reel
#
# Example:
#   If a point is >0.5m from midpoint, angle is outside [175, 185],
#   and spacing is outside ±0.75m, it may be flagged (if ≥2 checks fail).
# ------------------------------------------------------------------------------
gps_smoothing:
  capture_spacing_meters: 5.0
  deviation_threshold_m: 0.5
  angle_bounds_deg: [175, 185]
  proximity_check_range_m: 0.75
  max_route_dist_deviation_m: 0.5
  smoothing_window: 2
  outlier_reason_threshold: 2
  segment_break_distance_m: 100.0
  segment_break_time_seconds: 120.0

# ------------------------------------------------------------------------------
# 🚚 DELIVERY SUBSET (Pre-AWS OID/Image Selection)
# ------------------------------------------------------------------------------
# Builds a publish/delivery subset from the master OID right before cloud delivery
# steps (Upload to AWS and service publication).
#
# Why this exists:
#   - Keep local master OID/images at full density (for QA and future analytics)
#   - Deliver a practical subset OID/image set to AWS and hosted services
#
# High-level behavior:
#   1) Optional spacing selector chooses candidates by index stride
#      (with optional distance validation/correction)
#   2) Optional MP range selector restricts rows by milepost windows
#   3) If both selectors are enabled, final selection is the INTERSECTION
#      (rows must pass both)
#
# Selector details:
#   spacing_selector
#     - mode=auto_stride: stride = round(target_spacing / source_capture_spacing)
#     - mode=fixed_stride: uses stride_override directly
#     - validate_distance=true: checks selected spacing against tolerance_percent
#       and applies local correction_strategy when needed
#
#   mp_range_selector
#     - Supports multiple MP_Pre windows in one run
#     - Each entry in ranges is inclusive on [min, max]
#     - Example combined selection:
#         M 1.0-2.0 and N 5.0-6.0
#
# Output strategies:
#   output.strategy=manifest
#     - Preferred default; files remain in place
#     - Downstream steps consume selected filenames from manifest
#
#   output.strategy=subset_folder
#     - Materializes selected images in a dedicated folder
#     - Useful for compatibility with folder-only downstream tooling
#
# Failure policy:
#   on_validation_failure=warn_and_continue
#     - Keep best candidate and continue; write warning details to logs/manifest
#   on_validation_failure=error
#     - Stop the step on unresolved spacing validation/correction
# ------------------------------------------------------------------------------
delivery_subset:
  enabled: false

  # Source capture profile and target delivery spacing (meters)
  source_capture_spacing_meters: 1.0
  target_spacing_meters: 5.0

  # Runtime sanity-check of source capture spacing from OID geometry.
  # Computes median spacing from consecutive points per reel (no cross-reel segments),
  # then compares observed median against source_capture_spacing_meters.
  capture_spacing_validation:
    max_deviation_percent: 25.0         # Warn/error when observed vs configured exceeds this percent
    min_reels_with_estimate: 1          # Minimum reels with valid geometry needed to evaluate

  spacing_selector:
    enabled: true

    # Primary index selection strategy
    mode: "auto_stride"                 # Options: "auto_stride", "fixed_stride"
    stride_override: null                # Integer stride used only when mode="fixed_stride"
    group_by_reel: true                  # Restart index counting per reel

    # Distance QA and local correction controls
    validate_distance: true              # Validate selected spacing with lat/long distance
    tolerance_percent: 10.0              # Accept spacing in target +/- tolerance_percent
    max_local_adjustments_per_pick: 2    # Local adjustment attempts per selected pair
    correction_strategy: "nearest_candidate"  # Options: "nearest_candidate", "forward_only"

  mp_range_selector:
    enabled: false

    # Multiple ranges can be combined in one delivery OID.
    # Each range is inclusive on milepost values and tied to one MP_Pre.
    # Examples:
    #   - { mp_pre: "M", min: 1.0, max: 2.0 }
    #   - { mp_pre: "N", min: 5.0, max: 6.0 }
    ranges: []

  # Output artifact consumed by downstream delivery steps
  output:
    strategy: "manifest"               # Options: "manifest", "subset_folder"
    manifest_filename: "delivery_subset_manifest.csv"
    subset_folder_name: "delivery_subset"

  # Behavior when spacing validation/correction cannot confirm target spacing
  on_validation_failure: "warn_and_continue"  # Options: "warn_and_continue", "error"

# --------------------------------------------------------------------
# 📏 DISTANCE-BASED SPACING FILTER
# --------------------------------------------------------------------
#
# This section controls detection and filtering of time-based capture reels.
# Time-based captures (0.1s intervals) create very dense point clusters that
# are easily distinguished from proper distance-based captures (~5m spacing).
#
# 🔍 Detection Logic:
#   Analyzes each reel's spacing pattern to identify time-based captures:
#   - Calculates ratio of points <1m apart (should be <40% for distance-based)
#   - Checks average spacing (should be >2m for distance-based)
#   - Only processes reels that clearly show time-based pattern
#
# 📐 Parameters:
#   - min_spacing_meters: Target spacing for filtered results (typically 5m)
#   - tolerance_meters: Acceptable variation in spacing (±1m)
#
# 🎯 Use Cases:
#   - Detect reels accidentally captured in time mode (0.1s intervals)
#   - Filter dense time captures to proper 5m spacing
#   - Preserve legitimate distance-based reels (5m or 10m spacing)
#
# ✅ Safe Operation:
#   - Only affects reels with obvious time-based capture patterns
#   - Preserves reels with proper distance-based spacing (5m/10m)
#   - Maintains chronological order within each reel
#
distance_spacing:
  min_spacing_meters: 5.0    # Minimum distance between images
  tolerance_meters: 1.0      # Tolerance for spacing variation

# ------------------------------------------------------------------------------
# 🖼️ IMAGE OUTPUT
# ------------------------------------------------------------------------------
#
# This section controls how images are:
#   - 📛 Renamed and copied using structured filenames
#   - 🏷️ Tagged with EXIF/XMP metadata during the "Update Metadata" stage
#
# ------------------------------------------------------------------------------
# 🧠 Expression Engine (Used in filename_settings and metadata_tags)
# ------------------------------------------------------------------------------
#
# Values are defined using string-based expressions, resolved dynamically from:
#   - `"field.FIELDNAME"` → OID feature attribute
#   - `"config.KEY"` → Project, camera, or tool settings
#   - `"'Literal string'"` → Hardcoded literal value (use single quotes to preserve spacing)
#
# 🔧 Supported format transforms:
#   - `.float(n)` → Format number to `n` decimal places
#   - `.int` → Convert to integer
#   - `.date(fmt)` → Format datetime using strftime codes
#   - `.strip(chars)` → Remove specific characters
#   - `.lower` / `.upper` → Convert string case
#
# ✨ Notes:
#   - All values are evaluated as strings unless formatting is applied
#   - Missing/null fields are skipped silently
#   - List-based values (e.g., XPKeywords) are joined with semicolons
# ------------------------------------------------------------------------------
# 📛 FILENAME GENERATION
# ------------------------------------------------------------------------------
#
# Controls how output filenames are generated using a format string with named parts.
#
# Each `{key}` in the `format:` string maps to an entry in `parts:`.
# Expressions are resolved using the expression engine above.
#
# 🧪 Example:
#   With:
#     config.project.slug = "RMI25100"
#     field.RR = "BNSF"
#     field.MP_Pre = "W"
#     field.MP_Num = 20.123
#     field.AcquisitionDate = 2025-04-05 11:30:05Z
#     field.Reel = 0001
#     field.Frame = 000234
#
#   Resulting filename:
#     RMI25100_BNSF_W20.123_20250405T113005Z_RL0001_FR000234.jpg
image_output:
  folders:
    parent: "panos"
    original: "original"
    renamed: "final"
  filename_settings:
    format: "{project_slug}_{rr}_{mp_pre}{mp_num}_{capture_datetime}_RL{reel}_FR{frame}.jpg"
    format_no_lr: "{project_slug}_{rr}_{capture_datetime}_RL{reel}_FR{frame}.jpg"
    parts:
      project_slug: "config.project.slug"
      rr: "field.RR"
      mp_pre: "field.MP_Pre"
      mp_num: "field.MP_Num.float(3)"
      capture_datetime: "field.AcquisitionDate.date(%Y%m%dT%H%M%SZ)"
      reel: "field.Reel"
      frame: "field.Frame"

# ------------------------------------------------------------------------------
# 🏷️ METADATA TAGGING
# ------------------------------------------------------------------------------
#
# Controls EXIF/XMP metadata tags written to each image via ExifTool.
# Each tag is assigned:
#   - A string expression
#   - Or a list of expressions (joined with semicolons, e.g., for XPKeywords)
#
# Expression behavior is documented in the shared engine section above.
#
# 🧪 Example:
#   ImageDescription: "field.RR + ' MP ' + field.MP_Pre + '-' + field.MP_Num.float(3)"
#   Resolves to: "BNSF MP W-123.456"
  metadata_tags:
    Artist: "config.project.company"
    Copyright: "'© ' + now.year + ' ' + config.project.company"
    Software: "config.camera.software"
    Make: "config.camera.make"
    Model: "config.camera.model"
    SerialNumber: "config.camera.sn"
    FirmwareVersion: "config.camera.firmware"
    ImageDescription: "field.RR + ' MP ' + field.MP_Pre + '-' + field.MP_Num.float(3)"
    XPComment: "config.project.number + ' ' + config.project.rr_name + ' - ' + config.project.description"
    XPKeywords:
      - "config.project.company"
      - "360 Imagery"
      - "Panoramic"
      - "Oriented Imagery"
      - "Railroad"
      - "config.project.rr_name"
      - "config.project.rr_mark"
      - "config.camera.model"
      - "field.MP_Pre + '-' + field.MP_Num.float(3)"
      - "config.project.description"
      - "config.project.number"
    GPano:
      UsePanoramaViewer: "True"
      CaptureSoftware: ""
      StitchingSoftware: "config.camera.stitching_software"
      ProjectionType: "equirectangular"
      PoseHeadingDegrees: "field.CameraHeading"
      PosePitchDegrees: "field.CameraPitch"
      PoseRollDegrees: "field.CameraRoll"
      InitialViewHeadingDegrees: "field.CameraHeading"
      InitialViewPitchDegrees: "field.CameraPitch"
      InitialViewRollDegrees: "field.CameraRoll"
      InitialHorizontalFOVDegrees: 75.0
      CroppedAreaLeftPixels: 0
      CroppedAreaTopPixels: 0
      CroppedAreaImageWidthPixels: "config.camera.image_width"
      CroppedAreaImageHeightPixels: "config.camera.image_height"
      FullPanoWidthPixels: "config.camera.image_width"
      FullPanoHeightPixels: "config.camera.image_height"
      FirstPhotoDate: "field.AcquisitionDate.date(%Y%m%dT%H%M%SZ)"
      LastPhotoDate: "field.AcquisitionDate.date(%Y%m%dT%H%M%SZ)"
      SourcePhotosCount: "config.camera.source_photos"
      ExposureLockUsed: "True"

# ------------------------------------------------------------------------------
# ☁️ AWS CLOUD EXPORT & HOSTING
# ------------------------------------------------------------------------------
# Defines AWS auth and upload mechanics for copy_to_aws.py. This block governs
# HOW images and artifacts are uploaded (credentials, threading, retries) and
# the available buckets. WHICH bucket OID images land in, and how ImagePath is
# written, is decided by the secured_storage block below.
#
# The toolbox runs in one AWS account (the account that owns the upload
# buckets). ArcGIS Enterprise may live in a separate account and reach the
# secured bucket at view time via credentials on the registered cloud store.
# That cross-account bridge is not handled by this toolbox.
#
# Authentication (auth_mode):
#   - instance: EC2 instance role (production)
#   - keyring: Pull keys from OS keyring (keyring_service_name)
#   - config: Plaintext keys below (development only)
#
# Buckets:
#   - s3_bucket: Public or unsecured hosting bucket (legacy OID model)
#   - s3_bucket_raw: Raw video and artifact uploads (raw and prod split)
#   - secured_storage.s3_bucket: Secured OID bucket used in virtual cache mode
#
# Upload settings:
#   - use_acceleration: Enable S3 Transfer Acceleration
#   - skip_existing: Skip files already logged as uploaded
#   - max_workers: Upload threads; fixed int (16) or pattern (cpu*2)
#   - retries: Retry attempts for failed uploads
#   - upload_batch_size: Files per batch (enables cancel checkpoints)
#   - allow_cancel_file_trigger: Allow cancel via cancel_copy.txt
#
# Lambda / publishing:
#   - lambda_role_arn: IAM role assumed by the Lambda progress monitor
#     Required permissions: s3:ListBucket on target bucket, s3:GetObject on
#     bucket or folder, cloudwatch:PutMetricData (optional).
# ------------------------------------------------------------------------------

aws:
  region: "<YOUR_AWS_S3_REGION>"
  auth_mode: "instance"            # "instance" | "keyring" | "config"

  # Buckets
  s3_bucket: "<YOUR_S3_BUCKET_NAME>"             # Public or unsecured hosting bucket
  s3_bucket_raw: "<YOUR_S3_RAW_BUCKET_NAME>"     # Raw uploads
  s3_bucket_folder: "config.project.slug"        # Key prefix; aligns with ImagePath model

  # Upload mechanics
  use_acceleration: true
  skip_existing: true
  max_workers: 16                  # Fixed int (16) or pattern (cpu*2)
  retries: 3
  upload_batch_size: 25
  allow_cancel_file_trigger: true

  # Keyring (used when auth_mode: keyring)
  keyring_aws: false
  keyring_service_name: aws_s3

  # Plaintext keys (development only; used when auth_mode: config)
  access_key: "<ACCESS_KEY_ID>"
  secret_key: "<SECRET_ACCESS_KEY>"

  lambda_role_arn: "<YOUR_LAMBDA_IAM_ROLE_ARN>"

# ------------------------------------------------------------------------------
# 🔒 SECURED STORAGE (ArcGIS Cloud Store / Virtual Cache Directory)
# ------------------------------------------------------------------------------
# Single switch between two OID image-delivery models.
#
# Behavior:
#   enabled: false -> legacy mode
#     - Images upload to aws.s3_bucket
#     - generate_oid_service rewrites ImagePath as public URLs
#
#   enabled: true -> secured mode
#     - Images upload to secured_storage.s3_bucket
#     - ImagePath is written as:
#         $virtualCacheDirectory:<project_slug>/<image_filename>
#
# In secured mode, the bucket name is not written in ImagePath. The registered
# cloud store resolves it. Image Path Prefix and Suffix are not used.
#
# The upload destination and ImagePath model should switch together from this
# one flag so uploads and paths stay aligned.
#
# Requirements:
#   ArcGIS Pro 3.7+ and ArcGIS Enterprise 12.0+.
#   Cloud store must be registered on the hosting server.
#
# Notes:
#   - Keep enabled: false in config.sample.yaml.
#   - Enable per project when secured delivery is validated.
#   - Secured-storage serving on Enterprise 12.0 is unverified pending Esri Case 04187998.
#   - Keep enabled: false until Esri resolves Case 04187998.
#   - s3_bucket_folder must match upload key prefix to avoid path drift.
# ------------------------------------------------------------------------------
secured_storage:
  enabled: false                                # Sample default: legacy mode
  cloud_store_name: "<CLOUD_STORE_NAME>"       # Name registered in Server Manager
  s3_bucket: "<YOUR_SECURED_S3_BUCKET_NAME>"   # Secured OID bucket
  region: "<YOUR_AWS_S3_REGION>"
  s3_bucket_folder: "config.project.slug"      # Must match upload key prefix

# ------------------------------------------------------------------------------
# 🌐 PORTAL SERVICE PUBLISHING
# ------------------------------------------------------------------------------
# This section defines parameters for publishing the final Oriented Imagery
# Dataset (OID) as a hosted service using ArcGIS Online or Enterprise Portal.
#
# It is used by the `generate_oid_service.py` utility and the
# "Generate OID Service" ArcGIS Pro toolbox tool.
#
# ─── Parameters ───────────────────────────────────────────────────────────────
#
# project_folder     (str)   - Portal folder name where the service item will
#                              be created. Can be a literal string or a dynamic
#                              expression like "config.project.number".
#
# share_with         (str)   - Sharing level for the published service:
#                                 "PRIVATE"       → Only visible to owner
#                                 "ORGANIZATION"  → Shared with your org
#                                 "PUBLIC"        → Shared with everyone
#
# add_footprint      (str)   - Whether to include the OID footprint layer as a
#                              sublayer of the service:
#                                 "FOOTPRINT"     → Include footprint layer (default)
#                                 "NO_FOOTPRINT"  → Omit the footprint
#
# portal_tags        (list)  - List of tags to attach to the service item.
#                              Each tag can be a static string or an expression
#                              referencing config values. These will be joined
#                              with commas in the service metadata.
#
# summary            (str)   - Text summary (description) of the service item.
#                              Can include string expressions referencing
#                              project metadata.
#
# ─── Example Result ───────────────────────────────────────────────────────────
#
# With:
#   project.number = "25-100"
#   project.rr_name = "BNSF"
#   project.description = "Hi-rail imagery capture for Chicago Sub"
#
# And:
#   project_folder: "config.project.number"
#   portal_tags: ["config.project.number", "Oriented Imagery"]
#   summary: "'Oriented Imagery for ' + config.project.number + ' ' + config.project.rr_name + ' - ' + config.project.description"
#
# You get:
#   Folder:     "25-100"
#   Tags:       "25-100, Oriented Imagery"
#   Summary:    "Oriented Imagery for 25-100 BNSF - Hi-rail imagery capture for Chicago Sub"
#
# ─── Notes ────────────────────────────────────────────────────────────────────
# - All expressions are resolved using resolve_expression() from config_loader.
# - If publishing fails, check portal sign-in status in ArcGIS Pro.
# ------------------------------------------------------------------------------
portal:
  project_folder: "config.project.number"  # Or otherwise name
  share_with: "PRIVATE"                    # Options: PRIVATE, ORGANIZATION, PUBLIC
  add_footprint: "FOOTPRINT"               # Options: FOOTPRINT, NO_FOOTPRINT
  portal_tags:
    - "config.project.number"
    - "Oriented Imagery"
  summary: "'Oriented Imagery for ' + config.project.number + ' ' + config.project.rr_name + ' - ' + config.project.description"

# ------------------------------------------------------------------------------
# 🌍 GEOCODING & GEOGRAPHIC ENRICHMENT
# ------------------------------------------------------------------------------
# Controls how location names and geographic context are applied to images
# based on their GPS coordinates. This step is handled by the geocode_images.py
# script and is typically run after all GPS corrections are complete.
#
# Supported methods (mutually exclusive):
#   - "exiftool": Uses ExifTool's internal Geolocation module for basic reverse geocoding
#   - "geo_areas": Uses corridor geo-areas enrichment with Living Atlas data sources
#
# Note: Methods are mutually exclusive - ExifTool geocoding would overwrite geo-areas 
# EXIF data, so only one method can be active per workflow run.
#
# Method details:
#   🔍 "exiftool": Basic reverse geocoding using ExifTool's Geolocation module
#      - Location tags: City / State / Country (EXIF)
#      - LocationShownCity / ProvinceState / CountryName (XMP/IPTC-Ext)
#      - Simple point-based lookup from built-in or custom databases
#
#   🗺️ "geo_areas": Advanced corridor-aware geographic enrichment 
#      - Uses Living Atlas Places and Counties polygon data
#      - Milepost-aware context (prev/next/nearest places along route)
#      - Gap bridging and range building for continuous coverage
#      - Multi-tier verification with source tracking
#      - Detailed geographic context beyond simple reverse geocoding
#
# Supported ExifTool Configs (when method includes "exiftool"):
#   - "default" (no config file used; built-in DB of cities with population > 2000)
#   - "geolocation500" (uses config file that points to Geolocation500 DB)
#   - "geocustom" (uses config file that points to a custom geolocation DB built by user
#     as descrived in https://exiftool.org/geolocation.html)
#
# ⚠️ To use geolocation500:
#   1. Download: https://exiftool.org/Geolocation500-20250311.zip
#   2. Place the unzipped database in a known location.
#   3. Set 'geolocation500_config' to the .config file.
#   4. In that config file, define the absolute path:
#        $Image::ExifTool::Geolocation::geoDir = '/ABSOLUTE/PATH/TO/Geolocation500';
#   ➤ Note: Relative paths in .config are not supported.
#
# ⚠️ To use geocustom:
#   1. Use "build_geolocation" utility script from Exiftool (see https://exiftool.org/geolocation.html)
#   2. Place the unzipped database in a known location.
#   3. Set 'geocustom_config' to the .config file.
#   4. In that config file, define the absolute path:
#        $Image::ExifTool::Geolocation::geoDir = '/ABSOLUTE/PATH/TO/[NameOfYourCustomGeoDB]"';
#   ➤ Note: Relative paths in .config are not supported.
geocoding:
  method: "geo_areas"  # Options: "exiftool", "geo_areas" (mutually exclusive)
  exiftool_geodb: "default"  # Options: default, geolocation500, geocustom
  geoloc500_config_path: "templates/exiftool/geolocation500.config"
  geocustom_config_path: "templates/exiftool/geocustom.config"

# ------------------------------------------------------------------------------
# 🌍 GEO-AREAS ENRICHMENT  
# ------------------------------------------------------------------------------
# Controls how corridor photo points are enriched with Place/County/State context
# and milepost-aware information before ExifTool tagging. This provides more
# detailed geographic context than basic reverse geocoding.
#
# This enrichment runs BEFORE apply_exif_metadata to ensure all geographic area
# data is available for EXIF metadata application in a single batch operation.
#
# Processing modes:
#   - CONTAINMENT_ONLY: Only polygon containment joins
#   - CONTAINMENT+MILEPOST_CONTEXT: Add prev/next/nearest milepost context (legacy)
#   - CONTAINMENT+MILEPOST+GAP_BRIDGE: Add gap bridging between same places (legacy)  
#   - CONTAINMENT+RANGES_BUILD_APPLY: Add range-based lookup from anchors (recommended - most efficient)
#   - FULL: Complete enrichment workflow (comprehensive but includes redundant milepost step)
#
# Data sources (recommend Esri Living Atlas cached locally):
#   - places_fc: Polygon FC with place boundaries (cities, towns, CDPs)
#   - counties_fc: Polygon FC with county boundaries including state info
#
geo_areas:
  # Enable geo-areas enrichment (set to false to skip entirely)
  enabled: true
  
  # Processing mode - controls which enrichment steps to perform
  mode: "CONTAINMENT+RANGES_BUILD_APPLY"  # Options: CONTAINMENT_ONLY, CONTAINMENT+MILEPOST_CONTEXT, CONTAINMENT+MILEPOST+GAP_BRIDGE, CONTAINMENT+RANGES_BUILD_APPLY, FULL
  
  # Field names in the photos feature class
  mile_field: "milepost"        # Field containing milepost values
  route_field: "route_id"       # Field for route identification (optional, leave null for single route)
  
  # Gap bridging parameters
  max_gap_miles: 1.0           # Maximum gap distance (miles) for bridging between same-place anchors
  break_gap_miles: 0.5         # Gap distance (miles) that breaks range continuity
  min_points_per_range: 2      # Minimum points required for a valid place range
  
  # Nearest place promotion
  promote_nearest_to_actual: false    # Promote nearest place to actual place if within threshold
  max_nearest_miles: 2.0             # Maximum distance (miles) for promoting nearest place
  
  # Data source paths (update these to point to your Living Atlas data)
  places_fc: "gis_data/reference.gdb/USA_Places"      # Polygon FC containing place boundaries
  counties_fc: "gis_data/reference.gdb/USA_Counties"  # Polygon FC containing county boundaries
  
  # Optional corridor-specific places (for future near-buffer logic)
  corridor_places_fc: null     # Optional places clipped to corridor buffer
  
  # Reporting
  write_report_csv: true       # Generate QA report CSV with enrichment statistics  
  report_csv_filename: "geocode_geoareas_report.csv"  # Filename for QA report
  
  # EXIF metadata fallback strategy for points outside places
  # Controls what gets written to City/LocationShownCity tags when no place containment found
  city_fallback_strategy: "nearest_then_county"  # Options: "county_only", "nearest_only", "nearest_then_county"
  #   - "county_only": Use county name as fallback (e.g., "Adams County")
  #   - "nearest_only": Use nearest place name with optional indicator (e.g., "Springfield (nearest)")  
  #   - "nearest_then_county": Try nearest place first, then county (recommended)
  include_nearest_indicator: true                 # Add "(nearest)" suffix for nearest place fallbacks in City tags
  
  # XPKeywords enrichment for enhanced searchability
  include_county_keyword: true                    # Add county name to XPKeywords (e.g., "Adams County")
  include_directional_context: true              # Add directional context for points outside places (e.g., "2.4 miles east of Sedalia")
  
  # Milepost-based direction mapping (railroad operational directions)
  # Define directions based on increasing/decreasing milepost values along the route
  # This follows railroad operational direction rather than cardinal directions
  milepost_directions:
    increasing_direction: "west"   # Direction for increasing milepost values (e.g., "west", "north", "east", "south")
    decreasing_direction: "east"   # Direction for decreasing milepost values (opposite of increasing)
  #   Example: If closest place is at MP 125.2 and point is at MP 127.8,
  #   point is 2.6 miles in the "increasing_direction" (west) of the place
  
  # Performance tuning (advanced)
  nearest_radius_m: 8000       # Radius for nearest calculations (currently unused - using milepost logic)

# ----------------------------------------------------------------
# ORCHESTRATOR CONFIG
# ----------------------------------------------------------------
orchestrator:
  # Enable or disable waits before specific steps.
  wait_between_steps: false

  # Number of seconds to pause BEFORE executing each step listed in `wait_before_step`.
  # This gives the user time to cancel, prepare, or manually inspect state before proceeding.
  wait_duration_sec: 60  # e.g., wait 1 minute before each step listed

  # List of step keys where a pause should occur BEFORE the step starts.
  # Step keys must match those defined in the toolbox (e.g., "copy_to_aws", "generate_service").
  # Useful for long-running, irreversible, or cloud-based operations.
  wait_before_step:
    - add_images
    - smooth_gps
    - rename_images
    - geocode
    - build_footprints
    - deploy_lambda_monitor
    - generate_service

  # Enable or disable OID backups before specific steps.
  backup_oid_between_steps: true

  # List of step keys where an OID snapshot should be saved BEFORE the step runs.
  # This protects against data loss during critical or irreversible operations.
  backup_before_step:
    - smooth_gps
    - rename_images
    - generate_service

  # Location of the shared backup geodatabase where OID snapshots will be stored.
  # Backups are named like: OID_before_{step}_{timestamp}
  backup_folder: "backups"
  oid_backup_fgdb: "oid_snapshots.gdb"

  # ----------------------------------------------------------------
  # ARTIFACT BACKUP TO S3 (NEW)
  # ----------------------------------------------------------------
  # After workflow completion, optionally upload project artifacts to S3 for:
  # - Backup and version control
  # - Reproducibility (config used, logs generated, etc.)
  # - Archival and compliance
  #
  # Artifacts are uploaded with timestamps to:
  #   s3://{aws.s3_bucket_raw}/{project.slug}/{artifact_type}/{YYYYMMDD_HHMM}/
  #
  # Example: s3://rmi-360-raw/RMI25320/logs/20251030_1430/process_log.txt
  # ----------------------------------------------------------------
  upload_artifacts_to_s3: false  # Set to true to enable automatic upload after processing

  # Artifact types to upload (choose from: config, logs, report, gis_data)
  # - config: The config.yaml file used for this run
  # - logs: All log files (process_log.txt, exiftool logs, etc.)
  # - report: HTML report, JSON data, and associated assets
  # - gis_data: Any GIS reference data in the project gis_data/ folder
  artifact_types:
    - config
    - logs
    - report
    # - gis_data  # Uncomment if you want to backup GIS data as well

# ----------------------------------------------------------------
# DISK SPACE CONFIG
# ----------------------------------------------------------------
disk_space:
  check_enabled: True
  min_buffer_ratio: 1.1
